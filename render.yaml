services:
  - type: web
    name: esp32-ai-builder
    runtime: docker
    rootDir: esp32_ai_builder
    dockerfilePath: esp32_ai_builder/Dockerfile
    plan: standard
    region: oregon
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: DEVICE_AUTH_TOKEN
        generateValue: true
      - key: ARDUINO_CLI_PATH
        value: /app/bin/arduino-cli
      - key: WORKSPACE_DIR
        value: /app/server/workspace
