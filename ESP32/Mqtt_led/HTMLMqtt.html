<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESP32 MQTT LED Controller & Dashboard</title>
  <!-- Paho MQTT JavaScript Client via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151c2e;
      --card-border: #232f48;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --green: #22c55e;
      --red: #ef4444;
      --orange: #f97316;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #fff;
    }

    header p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    /* Connection Card */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f1523;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      margin-bottom: 1.5rem;
      font-size: 0.875rem;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--red);
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .status-indicator.online {
      background-color: var(--green);
      box-shadow: 0 0 10px var(--green);
    }

    /* LED Bulb Visualization */
    .bulb-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 1.75rem 0;
    }

    .bulb {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #202b42;
      border: 3px solid #334155;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.7);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .bulb.active-on {
      background: #38bdf8;
      border-color: #7dd3fc;
      box-shadow: 0 0 45px #38bdf8, inset 0 0 15px #ffffff;
    }

    .bulb.active-blink {
      background: #f59e0b;
      border-color: #fcd34d;
      box-shadow: 0 0 45px #f59e0b, inset 0 0 15px #ffffff;
      animation: pulse 0.5s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.4; }
      to { opacity: 1; }
    }

    .state-badge {
      margin-top: 1rem;
      padding: 0.35rem 1rem;
      border-radius: 20px;
      background: #0f1523;
      border: 1px solid var(--card-border);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Control Grid */
    .control-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.85rem;
      margin-bottom: 1.5rem;
    }

    button {
      background: #1e293b;
      border: 1px solid #334155;
      color: var(--text);
      padding: 0.9rem;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      user-select: none;
    }

    button:hover {
      background: #334155;
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(1px);
    }

    .btn-on {
      border-color: rgba(34, 197, 94, 0.4);
      color: #4ade80;
    }
    .btn-on:hover {
      background: rgba(34, 197, 94, 0.15);
      border-color: var(--green);
    }

    .btn-off {
      border-color: rgba(239, 68, 68, 0.4);
      color: #f87171;
    }
    .btn-off:hover {
      background: rgba(239, 68, 68, 0.15);
      border-color: var(--red);
    }

    .btn-span-2 {
      grid-column: span 2;
    }

    /* Settings & Logs Section */
    details {
      background: #0f1523;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      font-size: 0.85rem;
    }

    summary {
      cursor: pointer;
      font-weight: 600;
      color: var(--text-muted);
      outline: none;
    }

    summary:hover {
      color: var(--text);
    }

    .config-box {
      margin-top: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .config-box input {
      background: #151c2e;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 0.5rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-family: monospace;
    }

    #console-log {
      margin-top: 0.5rem;
      height: 90px;
      overflow-y: auto;
      background: #090d16;
      padding: 0.5rem;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.75rem;
      color: #93c5fd;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>ESP32 MQTT Dashboard</h1>
      <p>Cloud IoT Bi-directional LED Control</p>
    </header>

    <!-- Connection Indicator -->
    <div class="status-bar">
      <div class="status-item">
        <div id="mqtt-indicator" class="status-indicator"></div>
        <span id="mqtt-status-text">Connecting to Broker...</span>
      </div>
      <div class="status-item" style="color: var(--text-muted); font-size: 0.75rem;">
        HiveMQ WSS (8884)
      </div>
    </div>

    <!-- Live LED Visualizer -->
    <div class="bulb-container">
      <div id="led-bulb" class="bulb"></div>
      <div id="status-badge" class="state-badge">Hardware: UNKNOWN</div>
    </div>

    <!-- Action Buttons -->
    <div class="control-grid">
      <button class="btn-on" onclick="sendMQTTCommand('ON')">
        <span>⚡</span> Turn ON
      </button>
      <button class="btn-off" onclick="sendMQTTCommand('OFF')">
        <span>⭕</span> Turn OFF
      </button>
      <button onclick="sendMQTTCommand('BLINK_SLOW')">
        <span>⏳</span> Slow Blink (1s)
      </button>
      <button onclick="sendMQTTCommand('BLINK_FAST')">
        <span>⚡</span> Fast Blink (200ms)
      </button>
      <button class="btn-span-2" onclick="sendMQTTCommand('TOGGLE')">
        <span>🔄</span> Toggle State
      </button>
    </div>

    <!-- Topics & Live Debug Log -->
    <details>
      <summary>Settings & MQTT Logs</summary>
      <div class="config-box">
        <label>Command Topic (Publish):</label>
        <input type="text" id="cmd-topic" value="iot_lab_esp32_xyz/led/set" onchange="updateTopics()" />
        <label>Status Topic (Subscribe):</label>
        <input type="text" id="status-topic" value="iot_lab_esp32_xyz/led/status" onchange="updateTopics()" />
        <label>Live Packet Log:</label>
        <div id="console-log"></div>
      </div>
    </details>
  </div>

  <script>
    // ================= CONFIGURATION =================
    const BROKER_HOST = "broker.emqx.io";
    const BROKER_PORT = 8084; // Secure WebSocket Port for EMQX
    const BROKER_PATH = "/mqtt";

    let topicCommand = document.getElementById("cmd-topic").value;
    let topicStatus = document.getElementById("status-topic").value;

    const clientId = "WebDash-" + Math.random().toString(16).substring(2, 10);
    const client = new Paho.MQTT.Client(BROKER_HOST, BROKER_PORT, BROKER_PATH, clientId);

    // Set callback handlers
    client.onConnectionLost = onConnectionLost;
    client.onMessageArrived = onMessageArrived;

    // Connect to Broker over Secure WebSockets (WSS)
    connectBroker();

    function connectBroker() {
      logMessage(`Connecting to ${BROKER_HOST}:${BROKER_PORT}...`);
      client.connect({
        useSSL: true,
        timeout: 10,
        keepAliveInterval: 30,
        onSuccess: onConnectSuccess,
        onFailure: onConnectFailure
      });
    }

    function onConnectSuccess() {
      logMessage("Broker Connected! Subscribing to: " + topicStatus);
      document.getElementById("mqtt-indicator").classList.add("online");
      document.getElementById("mqtt-status-text").innerText = "Broker: Online";
      
      client.subscribe(topicStatus, { qos: 1 });
    }

    function onConnectFailure(err) {
      logMessage(`Connection failed: ${err.errorMessage}`);
      document.getElementById("mqtt-indicator").classList.remove("online");
      document.getElementById("mqtt-status-text").innerText = "Broker: Offline (Retrying...)";
      setTimeout(connectBroker, 5000);
    }

    function onConnectionLost(response) {
      logMessage(`Connection lost: ${response.errorMessage}`);
      document.getElementById("mqtt-indicator").classList.remove("online");
      document.getElementById("mqtt-status-text").innerText = "Disconnected";
      setTimeout(connectBroker, 5000);
    }

    // Handle Incoming MQTT messages from ESP32
    function onMessageArrived(message) {
      const payload = message.payloadString.trim();
      const topic = message.destinationName;
      logMessage(`[RX] ${topic} -> ${payload}`);

      const bulb = document.getElementById("led-bulb");
      const badge = document.getElementById("status-badge");

      badge.innerText = `Hardware: ${payload}`;

      if (payload === "ON") {
        bulb.className = "bulb active-on";
      } else if (payload === "OFF") {
        bulb.className = "bulb";
      } else if (payload.startsWith("BLINK")) {
        bulb.className = "bulb active-blink";
      } else if (payload === "OFFLINE") {
        bulb.className = "bulb";
        badge.innerText = "Hardware: OFFLINE (LWT)";
      }
    }

    // Publish command to ESP32
    function sendMQTTCommand(cmd) {
      if (!client.isConnected()) {
        alert("Cannot send command: Dashboard is not connected to MQTT broker.");
        return;
      }

      const msg = new Paho.MQTT.Message(cmd);
      msg.destinationName = topicCommand;
      msg.qos = 1;
      client.send(msg);
      logMessage(`[TX] ${topicCommand} -> ${cmd}`);
    }

    function updateTopics() {
      if (client.isConnected()) {
        client.unsubscribe(topicStatus);
      }
      topicCommand = document.getElementById("cmd-topic").value;
      topicStatus = document.getElementById("status-topic").value;
      if (client.isConnected()) {
        client.subscribe(topicStatus, { qos: 1 });
        logMessage(`Topics updated. Subscribed to ${topicStatus}`);
      }
    }

    function logMessage(text) {
      const consoleEl = document.getElementById("console-log");
      const time = new Date().toLocaleTimeString();
      const item = document.createElement("div");
      item.innerText = `[${time}] ${text}`;
      consoleEl.appendChild(item);
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }
  </script>
</body>
</html>
